<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画表紙 全巻検索 v3.0</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --border: #ccc;
            --muted: #555;
            --bg-soft: #e9ecef;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
            max-width: 960px;
            margin: 1em auto;
            padding: 0 1em;
            color: #222;
        }
        h1 { font-size: 1.6em; }

        /* 検索エリア */
        .search-row { display: flex; align-items: center; gap: 8px; }
        .search-box { position: relative; flex-grow: 1; }
        .search-box input {
            width: 100%;
            padding: 0.8em 2.4em 0.8em 0.8em;
            font-size: 1em;
            border: 1px solid var(--border);
            border-radius: 5px;
        }
        .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.5em;
            color: #999;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
            display: none;
        }
        .clear-btn.visible { display: block; }
        #searchButton {
            padding: 0.8em 1.2em;
            font-size: 1em;
            border: none;
            background-color: var(--primary);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            flex-shrink: 0;
            font-weight: bold;
        }
        #searchButton:hover { background-color: var(--primary-dark); }
        #searchButton:disabled { opacity: 0.6; cursor: wait; }

        /* 検索方式の注記 */
        #search-note {
            margin: 0.8em 0 0;
            padding: 8px 12px;
            font-size: 0.85em;
            background: #fff8e6;
            color: #8a5300;
            border: 1px solid #f0c36d;
            border-radius: 6px;
        }

        /* 結果エリア */
        #result-area { display: none; margin-top: 1.5em; flex-direction: column; gap: 1em; }
        #result-area.visible { display: flex; }

        /* コピー用プレビュー */
        #copy-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-soft);
            padding: 10px;
            border-radius: 8px;
        }
        #preview-text {
            flex-grow: 1;
            font-family: monospace;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }

        /* 編集エリア */
        #edit-controls summary { font-weight: bold; cursor: pointer; padding: 5px 0; }
        #edit-controls fieldset {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
            width: 100%;
        }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-size: 0.9em; min-width: 70px; font-weight: bold; color: var(--muted); }
        .control-group input {
            padding: 6px 8px;
            font-size: 0.9em;
            border: 1px solid var(--border);
            border-radius: 4px;
            flex-grow: 1;
        }
        .volume-group { flex-wrap: wrap; }
        #volumeA-input, #volumeB-input { width: 70px; text-align: center; flex-grow: 0; }

        /* Wikipedia / Google 表示 */
        #wiki-status {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.85em;
        }
        .wiki-badge {
            font: inherit;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .wiki-completed { background-color: #e6fffa; color: #006d5b; border-color: #006d5b; }
        .wiki-ongoing { background-color: #fff8e6; color: #b76e00; border-color: #b76e00; }
        .link-btn {
            text-decoration: none;
            background: var(--bg-soft);
            color: var(--muted);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.95em;
            display: inline-block;
            line-height: 1.3;
        }
        .link-btn:hover { background: #dde2e6; }

        /* アイコンボタン */
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            font-size: 1.2em;
            line-height: 1;
        }
        .icon-btn:hover { background-color: #e2e6ea; color: var(--primary); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
        #copy-button { background-color: var(--primary); color: #fff; padding: 8px; }
        #copy-button:hover { background-color: var(--primary-dark); color: #fff; }

        /* 表紙グリッド */
        #result-grid {
            margin-top: 1.5em;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
        }
        .cover-item img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: block;
        }
        .cover-item img:hover { opacity: 0.8; }
        .cover-caption { margin-top: 4px; font-size: 0.8em; color: var(--muted); text-align: center; }
        .loading, .error {
            grid-column: 1 / -1;
            font-size: 1.1em;
            color: var(--muted);
            text-align: center;
            padding: 20px;
            word-break: break-word;
        }

        /* 拡大表示 */
        #lightbox {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        #lightbox.open { display: flex; }
        #lightbox-img { max-width: 100%; max-height: 85%; object-fit: contain; }
        #close-button {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 3em;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }
        #filename-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }
        #filename-text { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <h1>漫画表紙 全巻検索</h1>

    <div class="search-row">
        <div class="search-box">
            <input type="text" id="mangaTitle" placeholder="漫画のタイトルを入力" lang="ja" autocomplete="off">
            <button type="button" class="clear-btn" id="clear-search" title="クリア">&times;</button>
        </div>
        <button type="button" id="searchButton">検索</button>
        <button type="button" id="key-settings" class="icon-btn" title="APIキーの設定">⚙</button>
    </div>
    <p id="search-note" hidden></p>

    <div id="result-area">
        <div id="copy-preview">
            <span id="preview-text"></span>
            <button type="button" id="copy-button" class="icon-btn" title="コピー">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
        </div>

        <details id="edit-controls" open>
            <summary>作者・タイトル・巻数を編集</summary>
            <fieldset>
                <div class="control-group">
                    <label for="author-input">作者名</label>
                    <input type="text" id="author-input">
                    <button type="button" class="icon-btn copy-part-btn" data-target="author-input" title="コピー">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    </button>
                </div>
                <div class="control-group">
                    <label for="title-input">タイトル</label>
                    <input type="text" id="title-input">
                    <button type="button" class="icon-btn copy-part-btn" data-target="title-input" title="コピー">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    </button>
                </div>
                <div class="control-group volume-group">
                    <label for="volumeA-input">巻数</label>
                    <input type="number" id="volumeA-input" placeholder="全/開始" min="1">
                    <span>-</span>
                    <input type="number" id="volumeB-input" placeholder="最終" min="1">
                    <span id="wiki-status"></span>
                </div>
            </fieldset>
        </details>
    </div>

    <div id="result-grid"></div>

    <div id="lightbox">
        <button type="button" id="close-button" title="閉じる">&times;</button>
        <img id="lightbox-img" alt="">
        <div id="filename-area">
            <span id="filename-text"></span>
            <button type="button" id="filename-copy-btn">コピー</button>
        </div>
    </div>

    <script>
        'use strict';

        // --- 1. 定数・DOM ---
        const STORAGE_KEY = 'google_books_key';
        const BOOKS_API = 'https://www.googleapis.com/books/v1/volumes';
        const WIKI_API = 'https://ja.wikipedia.org/w/api.php';

        const $ = (id) => document.getElementById(id);
        const el = {
            titleQuery: $('mangaTitle'),
            searchButton: $('searchButton'),
            clearSearch: $('clear-search'),
            keySettings: $('key-settings'),
            searchNote: $('search-note'),
            resultArea: $('result-area'),
            previewText: $('preview-text'),
            copyButton: $('copy-button'),
            author: $('author-input'),
            title: $('title-input'),
            volA: $('volumeA-input'),
            volB: $('volumeB-input'),
            wikiStatus: $('wiki-status'),
            grid: $('result-grid'),
            lightbox: $('lightbox'),
            lightboxImg: $('lightbox-img'),
            closeButton: $('close-button'),
            filenameText: $('filename-text'),
            filenameCopy: $('filename-copy-btn'),
        };

        const ICON_COPY = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
        const ICON_CHECK = '<svg viewBox="0 0 24 24" style="fill:#28a745"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

        // 連続検索時に、古い検索の結果で画面を上書きしないための状態
        let searchSeq = 0;
        let currentController = null;

        // --- 2. 汎用ヘルパー ---
        // 全角・半角、大文字・小文字、空白の違いを無視して比較するための正規化
        const normalize = (s) => (s || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');

        const createEl = (tag, props = {}, text) => {
            const node = document.createElement(tag);
            Object.assign(node, props);
            if (text !== undefined) node.textContent = text;
            return node;
        };

        const showGridMessage = (className, text) => {
            el.grid.replaceChildren(createEl('div', { className }, text));
        };

        const setSearching = (isSearching) => {
            el.searchButton.disabled = isSearching;
            el.searchButton.textContent = isSearching ? '検索中…' : '検索';
        };

        const writeClipboard = async (text) => {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }
            // file:// などで Clipboard API が使えない場合の予備手段
            const ta = createEl('textarea', { value: text });
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            if (!ok) throw new Error('copy command failed');
        };

        const flashCopied = (btn) => {
            if (btn.dataset.flashing) return;
            btn.dataset.flashing = '1';
            const original = btn.innerHTML;
            btn.innerHTML = btn.classList.contains('icon-btn') ? ICON_CHECK : '完了!';
            setTimeout(() => {
                btn.innerHTML = original;
                delete btn.dataset.flashing;
            }, 1500);
        };

        const copyText = async (text, btn) => {
            try {
                await writeClipboard(text);
                flashCopied(btn);
            } catch (err) {
                console.error(err);
                alert('コピーに失敗しました。');
            }
        };

        // --- 3. 文字列・ファイル名の生成 ---
        const generateFinalString = () => {
            const author = el.author.value.trim();
            const title = el.title.value.trim();
            const valA = el.volA.value.trim();
            const valB = el.volB.value.trim();
            let result = author ? `[${author}] ${title}` : title;
            if (valA && valB) {
                result += ` 第${valA}-${valB}巻`;
            } else if (valA) {
                result += ` 全${valA}巻`;
            }
            return result;
        };

        const updatePreview = () => {
            const text = generateFinalString();
            el.previewText.textContent = text;
            el.previewText.title = text;
        };

        // Windows で使えない文字を除去し、空白をアンダースコアに置換
        const sanitizeFilePart = (s) => s
            .trim()
            .replace(/[\\/:*?"<>|]/g, '_')
            .replace(/\s+/g, '_');

        const buildFilename = (volume) => {
            const parts = [sanitizeFilePart(el.author.value), sanitizeFilePart(el.title.value)];
            if (volume) parts.push(`v${String(volume).padStart(2, '0')}`);
            const base = parts.filter(Boolean).join('_').replace(/_+/g, '_').replace(/^_|_$/g, '');
            return `${base || 'cover'}.jpg`;
        };

        // --- 4. Google Books ---
        const findBestAuthor = (items) => {
            // 正規化したキーごとに集計（「尾田栄一郎」と「尾田 栄一郎」を同一視）
            const counts = new Map();
            items.slice(0, 10).forEach(item => {
                (item.volumeInfo?.authors || []).forEach(name => {
                    const key = normalize(name);
                    const entry = counts.get(key) || { name, count: 0 };
                    entry.count++;
                    counts.set(key, entry);
                });
            });
            if (!counts.size) return '';
            const entries = [...counts.values()];
            const max = Math.max(...entries.map(e => e.count));
            const best = entries.filter(e => e.count === max).map(e => e.name);
            return best.find(name => /[一-龠ぁ-んァ-ヶ]/.test(name)) || best[0];
        };

        // タイトル末尾の巻数・レーベル表記などを取り除く
        const VOLUME_SUFFIX_RE = /(?:\s*[,、]?\s*Vol\.?\s*\d+|\s+\d+|\s*第\d+巻|\s*\(\d+\)|\s*\(通常版\)|\s*\d+巻).*$/i;
        const getBaseTitle = (rawTitle) => (rawTitle || '').normalize('NFKC').replace(VOLUME_SUFFIX_RE, '').trim();

        const findBestTitle = (items, userInput) => {
            const key = normalize(userInput);
            const counts = new Map();
            items.slice(0, 10).forEach(item => {
                const base = getBaseTitle(item.volumeInfo?.title);
                if (base && normalize(base).includes(key)) {
                    counts.set(base, (counts.get(base) || 0) + 1);
                }
            });
            let bestTitle = userInput;
            let maxCount = 0;
            for (const [title, count] of counts) {
                if (count > maxCount) {
                    maxCount = count;
                    bestTitle = title;
                }
            }
            return bestTitle;
        };

        // 巻数を抽出（取れない場合は null）
        const extractVolumeNumber = (title) => {
            if (!title) return null;
            const match = title.normalize('NFKC').match(/(?:vol\.?\s*|第|#|[\s(\[])(\d{1,4})(?!\d)/i);
            return match ? parseInt(match[1], 10) : null;
        };

        const normalizeImageUrl = (url) => {
            try {
                const u = new URL(url.replace(/^http:/, 'https:'));
                u.searchParams.delete('edge'); // ページめくり風の加工を外す
                return u.toString();
            } catch {
                return url;
            }
        };

        const toLargeImageUrl = (url) => {
            try {
                const u = new URL(url);
                u.searchParams.set('zoom', '0');
                return u.toString();
            } catch {
                return url;
            }
        };

        const fetchBooks = async (query, apiKey, signal) => {
            const params = new URLSearchParams({
                q: query,
                langRestrict: 'ja',
                printType: 'books',
                maxResults: '40',
                key: apiKey,
            });
            const res = await fetch(`${BOOKS_API}?${params}`, { signal });
            let data;
            try {
                data = await res.json();
            } catch {
                const err = new Error(`HTTP ${res.status}`);
                err.status = res.status;
                throw err;
            }
            if (!res.ok || data.error) {
                const code = data.error?.code ?? res.status;
                const message = data.error?.message ?? res.statusText;
                const err = new Error(`APIエラー (${code}): ${message}`);
                err.status = code;
                throw err;
            }
            return data.items || [];
        };

        // intitle: で検索し、0件なら通常検索に切り替える
        // （2026年10月時点で、intitle: / inauthor: が0件になる不具合の報告あり）
        const searchBooks = async (userInput, apiKey, signal) => {
            const intitleItems = await fetchBooks(`intitle:${userInput}`, apiKey, signal);
            if (intitleItems.length) return { items: intitleItems, mode: 'intitle' };

            const plainItems = await fetchBooks(userInput, apiKey, signal);
            const key = normalize(userInput);
            const filtered = plainItems.filter(item => normalize(item.volumeInfo?.title).includes(key));
            if (filtered.length) return { items: filtered, mode: 'plain-filtered' };
            return { items: plainItems, mode: 'plain' };
        };

        const showSearchNote = (mode) => {
            const notes = {
                'plain-filtered': 'タイトル指定検索（intitle:）が0件だったため、通常検索の結果からタイトルに入力語を含む本を表示しています。',
                'plain': 'タイトル指定検索（intitle:）が0件だったため、通常検索の結果をそのまま表示しています。関係のない本が混ざる可能性があります。',
            };
            el.searchNote.textContent = notes[mode] || '';
            el.searchNote.hidden = !notes[mode];
        };

        const buildCoverList = (items, fallbackTitle) => {
            const unique = new Map();
            items.forEach(item => {
                const info = item.volumeInfo || {};
                const thumb = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail;
                if (!thumb) return;
                const imageUrl = normalizeImageUrl(thumb);
                if (unique.has(imageUrl)) return;
                unique.set(imageUrl, {
                    title: info.title || fallbackTitle,
                    imageUrl,
                    volume: extractVolumeNumber(info.title),
                });
            });
            return [...unique.values()].sort((a, b) => {
                if (a.volume === b.volume) return 0;
                if (a.volume === null) return 1;
                if (b.volume === null) return -1;
                return a.volume - b.volume;
            });
        };

        const renderCovers = (covers) => {
            if (!covers.length) {
                showGridMessage('error', '表紙画像のある本が見つかりませんでした。');
                return;
            }
            const fragment = document.createDocumentFragment();
            covers.forEach(book => {
                const item = createEl('div', { className: 'cover-item' });
                const img = createEl('img', {
                    src: book.imageUrl,
                    alt: book.title,
                    title: book.title,
                    loading: 'lazy',
                });
                img.dataset.volume = book.volume ?? '';
                const caption = createEl('div', { className: 'cover-caption' }, book.volume ? `第${book.volume}巻` : '巻数不明');
                item.append(img, caption);
                fragment.append(item);
            });
            el.grid.replaceChildren(fragment);
        };

        // --- 5. Wikipedia ---
        const cleanWikiValue = (raw) => raw
            .split(/<br\s*\/?>/i)[0]
            .replace(/<ref[^>]*\/>/gi, '')
            .replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, '')
            .replace(/<ref[^>]*>.*$/i, '')
            .replace(/<!--[\s\S]*?-->/g, '')
            .replace(/\{\{[^{}]*\}\}/g, '')
            .replace(/\[\[(?:[^|\]]*\|)?([^\]]*)\]\]/g, '$1')
            .replace(/<[^>]+>/g, '')
            .replace(/'{2,}/g, '')
            .trim();

        const fetchWikiVolume = async (title, signal) => {
            const searchParams = new URLSearchParams({
                action: 'query',
                list: 'search',
                srsearch: title,
                srlimit: '5',
                format: 'json',
                formatversion: '2',
                origin: '*',
            });
            const searchRes = await fetch(`${WIKI_API}?${searchParams}`, { signal });
            const searchData = await searchRes.json();
            const hits = searchData.query?.search || [];
            if (!hits.length) return null;

            // 記事名がタイトルと一致するもの → 前方一致するもの → 先頭の順で選ぶ
            const key = normalize(title);
            const page = hits.find(h => normalize(h.title) === key)
                || hits.find(h => normalize(h.title).startsWith(key))
                || hits[0];

            const parseParams = new URLSearchParams({
                action: 'parse',
                pageid: String(page.pageid),
                prop: 'wikitext',
                format: 'json',
                formatversion: '2',
                origin: '*',
            });
            const parseRes = await fetch(`${WIKI_API}?${parseParams}`, { signal });
            const parseData = await parseRes.json();
            const wikitext = parseData.parse?.wikitext;
            if (!wikitext) return null;

            // 「|巻数=」「| 巻数 = 」のどちらの書き方にも対応
            const match = wikitext.match(/^\s*\|\s*(?:巻数|既刊)\s*=\s*(.+)$/m);
            if (!match) return null;
            const text = cleanWikiValue(match[1]);
            return text ? { text, pageId: page.pageid, pageTitle: page.title } : null;
        };

        const renderWikiStatus = async (title, seq, signal) => {
            const googleQuery = `${title} 漫画 何巻まで`;
            const googleLink = createEl('a', {
                href: `https://www.google.com/search?q=${encodeURIComponent(googleQuery)}`,
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'link-btn',
            }, 'Google ↗');
            el.wikiStatus.replaceChildren(googleLink);

            try {
                const info = await fetchWikiVolume(title, signal);
                if (seq !== searchSeq || !info) return;

                const isCompleted = /全|完結|完|End/i.test(info.text);
                const isOngoing = /既刊|連載|現在/.test(info.text);
                if (!isCompleted && !isOngoing && !/\d/.test(info.text.normalize('NFKC'))) return;

                const mark = isCompleted ? '✅' : isOngoing ? '▶' : '?';
                const badge = createEl('button', {
                    type: 'button',
                    className: `wiki-badge ${isCompleted ? 'wiki-completed' : 'wiki-ongoing'}`,
                    title: `出典: Wikipedia「${info.pageTitle}」\nクリックで巻数欄に反映`,
                }, `${mark} ${info.text}`);

                // 完結済みなら「全N巻」、それ以外は「第1-N巻」として反映
                badge.addEventListener('click', () => {
                    const num = info.text.normalize('NFKC').match(/\d+/);
                    if (!num) return;
                    if (isCompleted) {
                        el.volA.value = num[0];
                        el.volB.value = '';
                    } else {
                        el.volA.value = '1';
                        el.volB.value = num[0];
                    }
                    updatePreview();
                });

                const wikiLink = createEl('a', {
                    href: `https://ja.wikipedia.org/?curid=${info.pageId}`,
                    target: '_blank',
                    rel: 'noopener noreferrer',
                    className: 'link-btn',
                }, 'Wiki ↗');

                el.wikiStatus.replaceChildren(badge, wikiLink, googleLink);
            } catch (err) {
                if (err.name !== 'AbortError') console.warn('Wikipedia情報の取得に失敗しました', err);
            }
        };

        // --- 6. APIキー管理 ---
        const getApiKey = () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return saved;
            const input = prompt('Google Books APIキーを入力してください（このブラウザに保存されます）:');
            const key = input?.trim();
            if (!key) {
                alert('APIキーがないため検索できません。');
                return null;
            }
            localStorage.setItem(STORAGE_KEY, key);
            return key;
        };

        const editApiKey = () => {
            const current = localStorage.getItem(STORAGE_KEY);
            const masked = current ? `${current.slice(0, 4)}…${current.slice(-4)}` : '未設定';
            const input = prompt(`APIキーを変更します（現在: ${masked}）\n空欄のままOKを押すと削除します。`, '');
            if (input === null) return;
            const key = input.trim();
            if (key) {
                localStorage.setItem(STORAGE_KEY, key);
                alert('APIキーを保存しました。');
            } else {
                localStorage.removeItem(STORAGE_KEY);
                alert('APIキーを削除しました。');
            }
        };

        // --- 7. メイン検索 ---
        const searchCovers = async () => {
            const userInput = el.titleQuery.value.trim();
            if (!userInput) return;

            const apiKey = getApiKey();
            if (!apiKey) return;

            currentController?.abort();
            const controller = new AbortController();
            currentController = controller;
            const seq = ++searchSeq;

            setSearching(true);
            showGridMessage('loading', '検索中...');
            el.resultArea.classList.remove('visible');
            el.searchNote.hidden = true;
            el.wikiStatus.replaceChildren();

            try {
                const { items, mode } = await searchBooks(userInput, apiKey, controller.signal);
                if (seq !== searchSeq) return;

                if (!items.length) {
                    showGridMessage('error', '作品が見つかりませんでした。');
                    return;
                }

                const bestTitle = findBestTitle(items, userInput);
                el.author.value = findBestAuthor(items);
                el.title.value = bestTitle;
                el.volA.value = '';
                el.volB.value = '';
                updatePreview();

                el.resultArea.classList.add('visible');
                showSearchNote(mode);
                renderCovers(buildCoverList(items, userInput));
                renderWikiStatus(bestTitle, seq, controller.signal);
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error(err);
                let hint = '';
                if ([400, 401, 403].includes(err.status)) {
                    hint = '（APIキーが原因の可能性があります。⚙ から再設定できます）';
                } else if (err.status === 429) {
                    hint = '（APIの利用上限に達した可能性があります）';
                }
                showGridMessage('error', `検索中にエラーが発生しました：${err.message}${hint}`);
            } finally {
                if (seq === searchSeq) setSearching(false);
            }
        };

        // --- 8. 拡大表示 ---
        const openLightbox = (img) => {
            const thumbUrl = img.src;
            // 大きい画像が取得できない場合はサムネイルを表示
            el.lightboxImg.onerror = () => {
                el.lightboxImg.onerror = null;
                el.lightboxImg.src = thumbUrl;
            };
            el.lightboxImg.src = toLargeImageUrl(thumbUrl);
            el.lightboxImg.alt = img.alt;
            el.filenameText.textContent = buildFilename(img.dataset.volume);
            el.lightbox.classList.add('open');
        };

        const closeLightbox = () => {
            el.lightbox.classList.remove('open');
            el.lightboxImg.onerror = null;
            el.lightboxImg.removeAttribute('src');
        };

        // --- 9. イベント ---
        el.searchButton.addEventListener('click', searchCovers);

        el.titleQuery.addEventListener('keydown', (e) => {
            // 日本語入力の変換確定のEnterでは検索しない
            if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) searchCovers();
        });

        el.titleQuery.addEventListener('input', () => {
            el.clearSearch.classList.toggle('visible', Boolean(el.titleQuery.value));
        });

        el.clearSearch.addEventListener('click', () => {
            currentController?.abort();
            searchSeq++;
            setSearching(false);
            el.titleQuery.value = '';
            el.clearSearch.classList.remove('visible');
            el.grid.replaceChildren();
            el.resultArea.classList.remove('visible');
            el.searchNote.hidden = true;
            el.wikiStatus.replaceChildren();
            el.titleQuery.focus();
        });

        el.keySettings.addEventListener('click', editApiKey);

        [el.author, el.title, el.volA, el.volB].forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        el.volA.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                el.volB.focus();
            }
        });

        el.copyButton.addEventListener('click', () => copyText(generateFinalString(), el.copyButton));

        document.querySelectorAll('.copy-part-btn').forEach(btn => {
            btn.addEventListener('click', () => copyText($(btn.dataset.target).value, btn));
        });

        el.grid.addEventListener('click', (e) => {
            const img = e.target.closest('img');
            if (img) openLightbox(img);
        });

        el.filenameCopy.addEventListener('click', () => copyText(el.filenameText.textContent, el.filenameCopy));
        el.closeButton.addEventListener('click', closeLightbox);
        el.lightbox.addEventListener('click', (e) => {
            if (e.target === el.lightbox || e.target === el.lightboxImg) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && el.lightbox.classList.contains('open')) closeLightbox();
        });
    </script>
</body>
</html>
